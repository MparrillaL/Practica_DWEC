<body>
    <p><a href="index.html">← Volver al índice</a></p>
    <h1>11 Varias acciones en una fila</h1>

<div id="filas">
  <p data-valor="0">A <output>0</output>
    <button data-accion="sumar">+</button>
    <button data-accion="restar">−</button>
    <button data-accion="reiniciar">Cero</button></p>
  <p data-valor="0">B <output>0</output>
    <button data-accion="sumar">+</button>
    <button data-accion="restar">−</button>
    <button data-accion="reiniciar">Cero</button></p>
</div>

    <!-- Comprueba tu solución: Suma dos veces en A y una en B; reinicia A: quedan 0 y 1. Restar en A no produce valores negativos. -->
